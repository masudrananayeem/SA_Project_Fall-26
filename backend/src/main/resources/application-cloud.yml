# Cloud demo profile (Render or Cloudflare Containers + managed PostgreSQL, e.g. Neon).
# Basic Auth with the ADMIN_/CUSTOMER_ credentials from Cloudflare secrets (same as the frontend),
# schema created/updated by Hibernate on an empty database, no Redis required.
# For a real production system use the "prod" profile (OIDC JWT + Flyway validate).
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
  cache:
    type: ${CACHE_TYPE:simple}
  data:
    redis:
      repositories:
        enabled: false
management:
  health:
    redis:
      enabled: false
server:
  port: ${PORT:8080}
  error:
    include-message: always
meterflow:
  billing:
    allow-open-period: ${METERFLOW_ALLOW_OPEN_PERIOD:true}
  webhooks:
    allow-private-hosts: false
