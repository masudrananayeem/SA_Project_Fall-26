spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${METERFLOW_OIDC_ISSUER_URI}
server:
  port: ${PORT:8080}
  error:
    include-message: never
meterflow:
  cors:
    allowed-origins: ${METERFLOW_CORS_ALLOWED_ORIGINS}
  billing:
    allow-open-period: false
  webhooks:
    allowed-hosts: ${METERFLOW_WEBHOOK_ALLOWED_HOSTS}
    allow-private-hosts: false
