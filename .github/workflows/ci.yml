name: MeterFlow CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, architecture (Spring Modulith) and QA1 accuracy tests
        run: mvn -B -f backend/pom.xml verify
  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL integration tests (Testcontainers)
        run: mvn -B -f backend/pom.xml verify -Pintegration
      - name: QA1 at acceptance size (1,000,000 events)
        run: mvn -B -f backend/pom.xml test -Dtest=Qa1AccuracyTest -Dqa1.events=1000000 -Dsurefire.failIfNoSpecifiedTests=false -DargLine=-Xmx3g
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Type-check and build admin console and customer portal
        run: npm run build
        working-directory: frontend
